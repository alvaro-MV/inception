# Authentication

anonymous_enable=NO
background=NO

local_enable=YES
write_enable=YES

guest_enable=YES
guest_username=www-data
pam_service_name=vsftpd_inception

# FTP root

local_root=/srv/vsftpd
secure_chroot_dir=/var/run/vsftpd/empty
virtual_use_local_privs=YES 


# Permissions

local_umask=022

# Jail users inside FTP root

chroot_local_user=YES
allow_writeable_chroot=YES

# Logging

xferlog_enable=YES
xferlog_std_format=YES

# Network

listen=YES

# TLS Comented for now.

# ssl_enable=YES

# rsa_cert_file=/etc/ssl/private/vsftpd.pem
# rsa_private_key_file=/etc/ssl/private/vsftpd.pem

# allow_anon_ssl=NO
# force_local_data_ssl=YES
# force_local_logins_ssl=YES

# ssl_tlsv1=YES
# ssl_sslv2=NO
# ssl_sslv3=NO

# require_ssl_reuse=NO
# ssl_ciphers=HIGH

# Passive mode

pasv_enable=YES
pasv_min_port=64000
pasv_max_port=64321
services:
  mariadb:
    container_name: mariadb
    image: mariadb-inception
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_net
    expose:
      - "3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$(cat /run/secrets/db_root_password) || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    container_name: wordpress
    image: wordpress-inception
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_HOST: mariadb
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password
      WP_USER_PASSWORD_FILE: /run/secrets/wp_user_password
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_net
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - "9000"
    restart: unless-stopped

  nginx:
    container_name: nginx
    image: nginx-inception
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception_net
    depends_on:
      - wordpress
      - adminer
      - portainer
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis-inception
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    expose:
      - "6379"
    networks:
      - inception_net
    restart: always

  adminer:
    container_name: adminer
    image: adminer-inception
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    networks:
      - inception_net
    expose:
      - "8080"
    restart: always
    depends_on:
      - mariadb
    
  ftp:
    container_name: ftp
    image: ftp-inception
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      FTP_USER: ${FTP_USER}
      FTP_PASSWORD_FILE: /run/secrets/ftp_password
    secrets:
      - ftp_password
    volumes:
      - wordpress_data:/srv/vsftpd
    networks:
      - inception_net
    ports:
      - "8888:21"
      - "64000-64321:64000-64321"
    restart: always
  
  portainer:
    container_name: portainer
    image: portainer-inception
    build:
      context: ./requirements/bonus/portainer
      dockerfile: Dockerfile
    env_file:
     - .env
    environment:
      PORTAINER_PASSWORD: /run/secrets/portainer_password
    secrets:
      - portainer_password
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - inception_net
    ports:
      - 127.0.0.1:9443:9443
      - 127.0.0.1:9000:9000
      - 127.0.0.1:8000:8000
    restart: always


secrets:
  db_root_password:
    file: ../secrets/db_root_password
  db_password:
    file: ../secrets/db_password
  wp_admin_password:
    file: ../secrets/wp_admin_password
  wp_user_password:
    file: ../secrets/wp_user_password
  ftp_password:
    file: ../secrets/ftp_password
  portainer_password:
    file: ../secrets/portainer_password


volumes:
  mariadb_data:
    name: mariadb_data

  wordpress_data:
    name: wordpress_data
  
  portainer_data:
    name: portainer_data

networks:
  inception_net:
    driver: bridge
